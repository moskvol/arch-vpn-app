<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arch VPN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; user-select: none; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .card { background: var(--card); border-radius: 20px; padding: 18px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .card-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; }

    .balance-box { display: flex; align-items: baseline; gap: 8px; }
    .balance-amount { font-size: 32px; font-weight: 900; color: #38bdf8; text-shadow: 0 0 16px var(--accent-glow); }

    .timer-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 30px; color: var(--success); font-size: 13px; font-weight: 700; margin-top: 6px; }
    
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: var(--accent); color: #090d16; font-size: 15px; font-weight: 700; border-radius: 14px; border: none; cursor: pointer; transition: 0.15s; margin-top: 10px; }
    .btn:active { transform: scale(0.97); }

    .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .game-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; text-align: center; cursor: pointer; transition: 0.2s; }
    .game-card:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.1); }
    .game-icon { font-size: 28px; margin-bottom: 6px; }
    .game-name { font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Arch VPN Control</h1>
    <p id="user-greeting">Загрузка аккаунта...</p>
  </div>

  <!-- Баланс монет -->
  <div class="card">
    <div class="card-title">Баланс монет</div>
    <div class="balance-box">
      <span class="balance-amount" id="coin-balance">🪙 100</span>
      <span style="color: var(--muted); font-size: 14px;">ArchCoins</span>
    </div>
  </div>

  <!-- Таймер подписки -->
  <div class="card">
    <div class="card-title">Статус подписки</div>
    <div class="timer-badge" id="sub-badge">
      <span>●</span>
      <span id="sub-timer">Загрузка...</span>
    </div>
    <button class="btn" onclick="copyVpnKey()">
      📋 Скопировать VLESS ключ
    </button>
  </div>

  <!-- Мини-игры -->
  <div class="card">
    <div class="card-title">Игровой зал (Монеты)</div>
    <div class="games-grid">
      <div class="game-card" onclick="playGame('chest')">
        <div class="game-icon">🎁</div>
        <div class="game-name">Сундук удачи</div>
      </div>
      <div class="game-card" onclick="playGame('slots')">
        <div class="game-icon">🎰</div>
        <div class="game-name">Слот-машина</div>
      </div>
      <div class="game-card" onclick="playGame('coinflip')">
        <div class="game-icon">🪙</div>
        <div class="game-name">Орёл / Решка</div>
      </div>
      <div class="game-card" onclick="playGame('quiz')">
        <div class="game-icon">🎯</div>
        <div class="game-name">Викторина</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Развернуть окно на весь экран

    // Читаем данные пользователя из Telegram
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-greeting').textContent = `Привет, ${user.first_name || user.username}!`;
    }

    // Пример обратного отсчёта до окончания подписки
    // В реальном приложении дату можно передавать через URL query параметры
    const expDate = new Date();
    expDate.setDate(expDate.getDate() + 28); // 28 дней

    function updateCountdown() {
      const now = new Date();
      const diff = expDate - now;
      if (diff <= 0) {
        document.getElementById('sub-timer').textContent = "Подписка истекла";
        return;
      }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      document.getElementById('sub-timer').textContent = `Осталось: ${days} дн. ${hours} ч. ${minutes} мин.`;
    }
    setInterval(updateCountdown, 60000);
    updateCountdown();

    function copyVpnKey() {
      tg.HapticFeedback.notificationOccurred('success');
      // Отправляем сигнал боту
      tg.sendData(JSON.stringify({ action: "get_key" }));
    }

    function playGame(type) {
      tg.HapticFeedback.impactOccurred('medium');
      tg.sendData(JSON.stringify({ action: "play_game", game: type }));
    }
  </script>
</body>
</html>
